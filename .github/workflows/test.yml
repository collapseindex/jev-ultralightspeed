name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Checkpoint files, TLS trust, threads against an event loop and the shutdown
    # path are all places where an operating system has opinions, so all three
    # get a say rather than Linux alone.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - run: python -m pytest tests -q

  fast:
    # The HTTP/2 path is the one the numbers were measured on, so it gets its
    # own job with the extra actually installed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest ".[dev]"
      - run: python -m pytest tests -q
      - name: HTTP/2 was really negotiated, not silently fallen back to
        # The only place this can be checked: a TLS interceptor on a developer
        # machine re-signs even loopback, and then the test skips itself. A skip
        # here would otherwise be a green tick over an unverified claim, so the
        # pass is looked for rather than the absence of a failure.
        run: |
          python -m pytest tests -k negotiates_http2 --no-header -rA | tee h2.log
          grep -q "1 passed" h2.log || {
            echo "the HTTP/2 test did not pass here; a skip is not good enough"; exit 1; }
      - name: the fast transport is the one chosen
        run: |
          python - <<'PY'
          from jev_ultralightspeed import Client, _http2
          assert _http2.available(), "the [fast] extra did not install httpx and h2"
          assert Client(key="ci").transport == "http2", "auto did not pick http2"
          print("http2 transport available and selected")
          PY
