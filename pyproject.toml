[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-ultralightspeed"
version = "0.19.0"
description = "A pile of text, one question about each: bulk classification with TypeSafe's Jev at 32x the throughput and 41% less money, under the published rate limit."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Alex Kwon", email = "ask@collapseindex.org" }]
keywords = ["jev", "typesafe", "llm", "classification", "throughput", "batching"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/collapseindex/jev-ultralightspeed"
Source = "https://github.com/collapseindex/jev-ultralightspeed"

[project.optional-dependencies]
fast = ["httpx[http2]>=0.27"]
dev = ["pytest>=8", "httpx[http2]>=0.27", "cryptography>=42"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/W style, F correctness, I import order, UP modern syntax, B likely bugs.
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The package root exists to re-export, which is what F401 is about.
"src/jev_ultralightspeed/__init__.py" = ["F401"]
